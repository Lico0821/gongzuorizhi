<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作日志填写系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei","PingFang SC",sans-serif; background:#f0f4f8; color:#333; padding:16px; }
  .container { max-width:800px; margin:0 auto; }
  h1 { font-size:22px; text-align:center; color:#1a3c6e; margin-bottom:4px; }
  .subtitle { text-align:center; color:#888; font-size:13px; margin-bottom:18px; }
  .card { background:#fff; border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:16px; }
  .colhead { font-size:14px; font-weight:bold; color:#1a3c6e; margin-bottom:10px; }
  label { display:block; font-size:13px; color:#555; margin-bottom:6px; }
  input,select,textarea { width:100%; padding:10px 12px; font-size:15px; border:1px solid #ccd4e0; border-radius:8px; font-family:inherit; outline:none; margin-bottom:12px; }
  textarea { resize:vertical; min-height:90px; }
  .btn { width:100%; padding:13px; font-size:16px; font-weight:bold; background:#4472c4; color:#fff; border:none; border-radius:8px; cursor:pointer; }
  .btn:hover { background:#3a63b0; }
  .btn.green { background:#2e7d32; }
  .btn.orange { background:#e67e22; }
  .btn.gray { background:#7f8c8d; }
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#2e7d32; color:#fff; padding:12px 22px; border-radius:8px; font-size:15px; box-shadow:0 4px 12px rgba(0,0,0,.2); opacity:0; transition:opacity .3s; z-index:99; pointer-events:none; }
  .toast.show { opacity:1; }
  .tip { font-size:12px; color:#999; margin-top:8px; text-align:center; }
  .table-wrap { overflow-x:auto; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  table { width:100%; border-collapse:collapse; font-size:12px; min-width:600px; }
  th,td { border:1px solid #e0e4ec; padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#4472c4; color:#fff; white-space:nowrap; }
  .file-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .file-bar .fname { flex:1; min-width:180px; font-size:13px; color:#333; background:#f5f7fa; padding:8px 12px; border-radius:8px; word-break:break-all; }
  .hidden { display:none; }
  .row2 { display:flex; gap:10px; }
  .row2 > div { flex:1; }
  .monthbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .monthbar select { width:auto; margin:0; }
</style>
</head>
<body>
<div class="container">
  <h1>工作日志填写系统</h1>
  <div class="subtitle">阳光电源习友路园区 · 工程维修记录（网页版）</div>

  <!-- 数据文件管理 -->
  <div class="card">
    <div class="colhead">📂 数据文件</div>
    <div class="file-bar">
      <span class="fname" id="fname">尚未加载文件</span>
      <button class="btn gray" style="width:auto; padding:8px 14px; font-size:13px; margin:0;" onclick="document.getElementById('openFile').click()">打开 Excel</button>
      <button class="btn orange" style="width:auto; padding:8px 14px; font-size:13px; margin:0;" onclick="downloadExcel()">下载 Excel</button>
    </div>
    <input type="file" id="openFile" accept=".xlsx,.xlsm" class="hidden" onchange="openFile(this)">
    <div class="tip" style="text-align:left; margin-top:8px;">💡 上传或打开一个 Excel，记录会加进去；下载的 Excel 保留完整漂亮格式。</div>
    <div class="tip" style="text-align:left;">⚠️ 本页数据存在当前手机浏览器里，清缓存或换手机会丢失，请常下载 Excel 备份。</div>
  </div>

  <!-- 月份切换 + 批量填写 -->
  <div class="card">
    <div class="colhead">📋 填写工作日志</div>
    <div class="monthbar">
      <span style="font-size:13px; color:#555;">当前工作表：</span>
      <select id="sheetSel" onchange="switchSheet()"></select>
      <button class="btn gray" style="width:auto; padding:6px 12px; font-size:13px; margin:0;" onclick="addMonthSheet()">+ 新建月份表</button>
    </div>
    <textarea id="batch" placeholder="粘贴一整天的记录：

7月22日
A3A9A7查看进水管管径尺寸大小
A10栋1层西南角男卫第三个门脱落已修复
A1栋24层西南玻璃门无法自动开启已上报

第一行写日期，下面每行一条；楼栋、处理结果自动识别。"></textarea>
    <button class="btn green" onclick="submitBatch()">⚡ 一键保存</button>
  </div>

  <!-- 单条填写 -->
  <div class="card">
    <div class="colhead">📝 方式二：单条填写</div>
    <div class="row2">
      <div><label>楼栋</label><input type="text" id="building" placeholder="如 A1 / A6"></div>
      <div><label>报修日期</label><input type="date" id="date"></div>
    </div>
    <label>报修内容</label>
    <textarea id="content" placeholder="如：18层西电梯口防火门闭门器坏需更换已上报"></textarea>
    <div class="row2">
      <div><label>完成时间</label><input type="text" id="done_time" placeholder="留空同报修日期"></div>
      <div><label>处理结果</label>
        <select id="result">
          <option value="已处理">已处理</option>
          <option value="处理中">处理中</option>
          <option value="已上报">已上报</option>
          <option value="未处理">未处理</option>
        </select>
      </div>
    </div>
    <button class="btn" onclick="submitSingle()">保存</button>
  </div>

  <!-- 已填记录 -->
  <div class="card">
    <div class="colhead">📋 已填记录</div>
    <div class="table-wrap">
      <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    </div>
    <div class="tip">共 <span id="count">0</span> 条</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var wb = null;
  var curFile = null;
  var HEADERS = ['序号','报修日期','楼栋','报修内容','完成时间','处理结果'];

  function today(){
    var d=new Date(); var m=String(d.getMonth()+1).padStart(2,'0'); var dd=String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+dd;
  }
  document.getElementById('date').value = today();

  function toast(msg, ok){
    var t=document.getElementById('toast'); t.textContent=msg;
    t.style.background = ok===false?'#c62828':'#2e7d32';
    t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2200);
  }

  // ===== 样式系统（关键：让下载的 Excel 保留漂亮格式）=====
  var FILL_TITLE = {patternType:'solid', fgColor:{rgb:'DDEBF7'}};
  var FILL_HEAD  = {patternType:'solid', fgColor:{rgb:'BDD7EE'}};
  var THIN = {style:'thin', color:{rgb:'000000'}};
  var BORDER_ALL = {top:THIN,bottom:THIN,left:THIN,right:THIN};

  function styleCell(cell, opts){
    if(!cell.s) cell.s = {};
    var s = cell.s;
    if(opts.fill) s.fill = opts.fill;
    if(opts.font) s.font = opts.font;
    if(opts.align) s.alignment = opts.align;
    if(opts.border) s.border = opts.border;
  }

  function applySheetStyle(ws, totalRows){
    // 自动用工作表实际范围确定数据行数，避免追加后行数算错
    var endRow = totalRows;
    if(ws['!ref']){
      var rr = XLSX.utils.decode_range(ws['!ref']);
      if(rr.e.r + 1 > endRow) endRow = rr.e.r + 1;
    }
    // 标题行(第1行)
    for(var c=1;c<=6;c++){
      var cell = ws[XLSX.utils.encode_cell({r:0,c:c-1})];
      if(cell) styleCell(cell, {fill:FILL_TITLE, font:{name:'微软雅黑',sz:14,bold:true}, align:{horizontal:'center',vertical:'center'}, border:BORDER_ALL});
    }
    // 表头行(第2行)
    for(var c=1;c<=6;c++){
      var cell = ws[XLSX.utils.encode_cell({r:1,c:c-1})];
      if(cell) styleCell(cell, {fill:FILL_HEAD, font:{name:'微软雅黑',sz:10,bold:true}, align:{horizontal:'center',vertical:'center'}, border:BORDER_ALL});
    }
    // 数据行：第4列(报修内容)靠左，其余居中 —— 全部强制覆盖，确保统一
    for(var r=2; r<endRow; r++){
      for(var c=1;c<=6;c++){
        var cell = ws[XLSX.utils.encode_cell({r:r,c:c-1})];
        if(cell){
          styleCell(cell, {font:{name:'微软雅黑',sz:10}, border:BORDER_ALL,
            align: (c===4? {horizontal:'left',vertical:'center',wrapText:true} : {horizontal:'center',vertical:'center'})});
        }
      }
    }
    // 列宽
    ws['!cols'] = [{wch:8},{wch:16},{wch:10},{wch:55},{wch:14},{wch:12}];
    // 合并标题
    if(!ws['!merges']) ws['!merges'] = [];
    if(!ws['!merges'].some(function(m){return m.s.r===0&&m.s.c===0;})){
      ws['!merges'].push({s:{r:0,c:0}, e:{r:0,c:5}});
    }
    // 说明：SheetJS 系列无法在导出时写入"冻结窗格"，
    // 下载后在 Excel/WPS 里 视图→冻结→冻结前两行 即可（或用下方模板文件）。
    // ws['!views']=[{state:'frozen', ySplit:2, xSplit:0, topLeftCell:'A3'}]; // 已验证无效
  }

  function refreshStyles(){
    if(!wb) return;
    wb.SheetNames.forEach(function(name){
      var ws = wb.Sheets[name];
      // 先强制刷新 !ref 为当前实际内容范围，确保新追加的行被算进来
      ws['!ref'] = XLSX.utils.encode_range(XLSX.utils.decode_range(ws['!ref'] || 'A1'));
      var range = XLSX.utils.decode_range(ws['!ref']);
      applySheetStyle(ws, range.e.r + 1);
    });
  }

  // ===== 工作簿操作 =====
  function newWorkbook(){
    wb = XLSX.utils.book_new();
    addMonthSheet(today(), true);
    curFile = '工作日志.xlsx';
    fillSheetSelect();
    renderTable();
  }

  function monthName(dateStr){
    // 'YYYY-MM-DD' -> 'YYYY年M月'
    var d = dateStr || today();
    var y = d.slice(0,4);
    var m = parseInt(d.slice(5,7));
    return y+'年'+m+'月';
  }

  function sheetTitle(name){
    // '2026年7月' -> '阳光电源习友路园区2026年7月份工程维修统计表'
    var m = name.match(/^(\d{4})年(\d{1,2})月$/);
    if(!m) return name;
    return '阳光电源习友路园区'+m[1]+'年'+m[2]+'月份工程维修统计表';
  }

  function addMonthSheet(dateStr, isInit){
    var name = monthName(dateStr || today());
    if(wb.Sheets[name]){ toast('已存在 '+name+' 表'); return; }
    var ws = XLSX.utils.aoa_to_sheet([[sheetTitle(name)], HEADERS]);
    applySheetStyle(ws, 2);
    XLSX.utils.book_append_sheet(wb, ws, name);
    fillSheetSelect();
    document.getElementById('sheetSel').value = name;
    renderTable();
    if(!isInit) toast('✅ 已新建 '+name+' 表');
  }

  function fillSheetSelect(){
    var sel = document.getElementById('sheetSel');
    var cur = sel.value;
    sel.innerHTML = '';
    wb.SheetNames.forEach(function(n){
      var o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o);
    });
    if(cur && wb.SheetNames.indexOf(cur)>=0) sel.value=cur;
    else sel.value = wb.SheetNames[0];
  }

  function switchSheet(){ renderTable(); }

  function getActiveSheet(){
    if(!wb){ newWorkbook(); }
    return wb.Sheets[document.getElementById('sheetSel').value];
  }

  function openFile(input){
    var f = input.files && input.files[0]; if(!f) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        wb = XLSX.read(e.target.result, {type:'array', cellStyles:true});
        curFile = f.name;
        refreshStyles();  // 打开时自动补样式
        document.getElementById('fname').textContent = '📄 '+f.name+'（'+wb.SheetNames.join(', ')+'）';
        fillSheetSelect();
        renderTable();
        toast('✅ 已打开 '+f.name);
      }catch(err){ toast('❌ 打不开这个文件：'+err.message, false); }
    };
    reader.readAsArrayBuffer(f);
    input.value='';
  }

  function sheetRows(){
    var ws = getActiveSheet();
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    return rows;
  }

  function maxSeq(){
    var rows = sheetRows(); var mx=0;
    for(var i=2;i<rows.length;i++){ var v=rows[i][0]; if(typeof v==='number'&&v>mx) mx=v; }
    return mx;
  }

  // 位置词（园区里不按楼栋编号、直接用位置称呼的区域），作为楼栋识别
  var LOCATION_WORDS = ['园区','裙楼','裙搂','食堂','大门','南门','北门','东门','西门','门岗','岗亭','广场','停车场','地下室','负层','大堂','大厅','报告厅','咖啡厅','健身房','会议室区'];
  function parseLine(line){
    // 1) A+数字 楼栋（A1、A10栋、A3A9A7）
    var m = line.match(/^(?:A\d{1,2}栋?)+/);
    if(m){ return {building:m[0], content:line.slice(m[0].length).trim()}; }
    // 2) 位置词作为楼栋（园区、裙楼、食堂…）
    for(var i=0;i<LOCATION_WORDS.length;i++){
      var w = LOCATION_WORDS[i];
      var idx = line.indexOf(w);
      if(idx===0){  // 位置词必须在行首，才算楼栋
        return {building:w, content:line.slice(w.length).trim()};
      }
    }
    // 3) 都不是，楼栋留空
    return {building:'', content:line.trim()};
  }
  function inferResult(content){
    if(/已上报|已登记/.test(content)) return '已上报';
    if(/待处理/.test(content)) return '未处理';
    if(/处理中/.test(content)) return '处理中';
    return '已处理';
  }

  // 根据日期自动决定写到哪个月份表
  function sheetForDate(cnDate){
    // '7月22日' -> '2026年7月'
    var m = cnDate.match(/^(\d{1,2})月(\d{1,2})日$/);
    if(!m) return document.getElementById('sheetSel').value;
    var now = today(); var y = now.slice(0,4);
    return y+'年'+m[1]+'月';
  }

  function submitBatch(){
    var text = document.getElementById('batch').value.trim();
    if(!text){ toast('请先粘贴内容', false); return; }
    var lines = text.split('\n').map(function(s){return s.trim();}).filter(function(s){return s && !s.startsWith('#');});
    var curDate=''; var added=0;
    // 预扫描，按日期分组写入对应月份表
    var pending = [];  // {date, rows[]}
    var dateGroup = {};
    lines.forEach(function(ln){
      var dm = ln.match(/^(\d{1,2})\s*月\s*(\d{1,2})\s*日$/);
      if(dm){ curDate = parseInt(dm[1])+'月'+parseInt(dm[2])+'日'; return; }
      var p = parseLine(ln);
      var date = curDate || (parseInt(today().slice(5,7))+'月'+parseInt(today().slice(8,10))+'日');
      if(!dateGroup[date]) dateGroup[date] = [];
      dateGroup[date].push({building:p.building, content:p.content, result:inferResult(p.content)});
      added++;
    });
    // 写入对应月份表
    Object.keys(dateGroup).forEach(function(date){
      var sheetName = sheetForDate(date);
      if(!wb.Sheets[sheetName]) addMonthSheetFromName(sheetName);
      var ws = wb.Sheets[sheetName];
      var seq = maxSeqIn(ws);
      dateGroup[date].forEach(function(item){
        seq++;
        XLSX.utils.sheet_add_aoa(ws, [[seq, date, item.building, item.content, date, item.result]], {origin:-1});
      });
    });
    refreshStyles();
    fillSheetSelect();
    renderTable();
    toast('✅ 保存 '+added+' 条');
    document.getElementById('batch').value='';
  }

  function addMonthSheetFromName(name){
    var ws = XLSX.utils.aoa_to_sheet([[sheetTitle(name)], HEADERS]);
    applySheetStyle(ws, 2);
    XLSX.utils.book_append_sheet(wb, ws, name);
  }
  function maxSeqIn(ws){
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''}); var mx=0;
    for(var i=2;i<rows.length;i++){ var v=rows[i][0]; if(typeof v==='number'&&v>mx) mx=v; }
    return mx;
  }

  function submitSingle(){
    var content = document.getElementById('content').value.trim();
    if(!content){ toast('请填写报修内容', false); return; }
    var p = parseLine(content);
    var d = document.getElementById('date').value;
    var date = parseInt(d.slice(5,7))+'月'+parseInt(d.slice(8,10))+'日';
    var done = document.getElementById('done_time').value.trim() || date;
    var building = document.getElementById('building').value.trim() || p.building;
    var sheetName = sheetForDate(date);
    if(!wb.Sheets[sheetName]) addMonthSheetFromName(sheetName);
    var ws = wb.Sheets[sheetName];
    var seq = maxSeqIn(ws)+1;
    XLSX.utils.sheet_add_aoa(ws, [[seq, date, building, content, done, document.getElementById('result').value]], {origin:-1});
    refreshStyles();
    fillSheetSelect();
    document.getElementById('sheetSel').value = sheetName;
    renderTable();
    toast('✅ 第 '+seq+' 条 已保存到 '+sheetName);
    document.getElementById('content').value='';
    document.getElementById('building').value='';
    document.getElementById('done_time').value='';
  }

  function renderTable(){
    var rows = sheetRows();
    var thead=document.getElementById('thead'), tbody=document.getElementById('tbody');
    thead.innerHTML=''; tbody.innerHTML='';
    HEADERS.forEach(function(h){ var th=document.createElement('th'); th.textContent=h; thead.appendChild(th); });
    if(rows.length<=2){
      var tr=document.createElement('tr'); var td=document.createElement('td');
      td.colSpan=6; td.textContent='这个月还没有记录，填上面表单提交即可';
      td.style.cssText='text-align:center;color:#aaa;padding:30px;'; tr.appendChild(td); tbody.appendChild(tr);
    } else {
      for(var i=2;i<rows.length;i++){
        var tr=document.createElement('tr');
        for(var c=0;c<6;c++){ var td=document.createElement('td'); td.textContent = rows[i][c]||''; tr.appendChild(td); }
        tbody.appendChild(tr);
      }
    }
    document.getElementById('count').textContent = Math.max(0, rows.length-2);
  }

  function downloadExcel(){
    if(!wb){ newWorkbook(); }
    refreshStyles();
    var name = curFile || '工作日志.xlsx';
    if(!/\.xlsx$/i.test(name)) name += '.xlsx';
    XLSX.writeFile(wb, name);
    toast('✅ 已下载 '+name+'（含格式）');
  }

  // 初始
  newWorkbook();
</script>
</body>
</html>
